project:
  type: website
  output-dir: _site
  pre-render:
    - python3 tools/check_es_sync.py
    - python3 tools/plaincheck.py --prerender
  execute-dir: project   # es/ pages source R/ and data/ from the project root, like the English pages
  render:
    - index.qmd
    - scorecard.qmd
    - equity.qmd
    - schools.qmd
    - history.qmd
    - research.qmd
    - handouts.qmd
    - es/*.qmd
    - methods.qmd
  resources:
    - data/*.csv
    - handouts/atkinson_dli_slide1*.png
    - handouts/atkinson_dli_slide3*.png
    - handouts/atkinson_lent_travel_times.csv
    - data/*.geojson

website:
  title: "PPS Dual Language Immersion & Rightsizing"
  google-analytics: "G-12LM4TCE9C"
  description: "How the Portland Public Schools rightsizing scenarios (Oct 2026) change dual language immersion: demand, sites, access and enrollment."
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: scorecard.qmd
        text: Demand
      - href: equity.qmd
        text: Equity
      - href: schools.qmd
        text: School changes
      - href: history.qmd
        text: Lent & Chávez
      - href: research.qmd
        text: Whole-school vs. strand
      - href: handouts.qmd
        text: Handouts
      - href: methods.qmd
        text: Methods
    right:
      - icon: github
        href: https://github.com/jminnier/pps-dli-explorer
        aria-label: Source code and data on GitHub
        text: Code
  page-footer:
    center: "Code, source documents and data: [github.com/jminnier/pps-dli-explorer](https://github.com/jminnier/pps-dli-explorer). Data: PPS Data & Reporting, PPS lottery results, PSU Population Research Center, US Census ACS. Scenario maps and board-memo transcription from [pps-explorer](https://github.com/browniefed/pps-explorer) by Jason Brown."

format:
  html:
    theme: [flatly, styles/site.scss]
    include-after-body: [lang-switch.html]
    toc: true
    toc-depth: 2
    code-fold: true
    code-summary: "R code"
    fig-width: 8
    fig-height: 4.5

execute:
  echo: false
  warning: false
  message: false
  freeze: false   # always re-run pages so they match data/ (a full render takes ~15 s)
